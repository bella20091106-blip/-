
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 홈페이지</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f5f2;
      color: #333;
      text-align: center;
      padding: 60px 20px;
    }

    h1 {
      font-size: 36px;
    }

    p {
      font-size: 17px;
      line-height: 1.8;
    }

    button {
      background: #333;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 22px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>안녕! 👋</h1>
  <p>나만의 홈페이지에 오신 것을 환영합니다.</p>
  <button onclick="alert('홈페이지가 정상적으로 작동해요!')">
    눌러 보기
  </button>
</body>
</html>
